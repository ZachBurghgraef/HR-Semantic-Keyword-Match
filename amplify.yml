version: 1
backend:
  phases:
    build:
      commands:
        # Install clean dependencies using the lockfile
        - npm ci --cache .npm --prefer-offline
        # Provision Cognito, IAM, and custom Lambda integration code
        - npx ampx pipeline-deploy
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Compiles frontend assets and evaluates structural UI styling
        - npm run build
  artifacts:
    # Vite outputs production bundles to the dist directory
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
