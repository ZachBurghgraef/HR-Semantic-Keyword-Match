name: Deploy with AWS CDK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'notebooks/**'
      - 'README.md'
  workflow_dispatch:

# Never run two deploys of the same stack at once.
concurrency:
  group: cdk-deploy
  cancel-in-progress: false

# id-token: write lets the job request an OIDC token from GitHub (used to log
# in to AWS below). Listing permissions also drops everything else to none,
# so contents: read is needed for actions/checkout.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      # The CDK CLI is a Node.js tool, even when the app itself is written in Python.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: infra/requirements.txt

      - name: Install CDK CLI and CDK Python library
        run: |
          npm install -g aws-cdk@2.1145.0
          pip install -r requirements.txt

      # Fail early with a readable message if the role ARN variable is missing or
      # malformed (STS only says "Request ARN is invalid"). A role ARN isn't
      # secret, so printing it is fine.
      - name: Check AWS_DEPLOY_ROLE_ARN
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          echo "AWS_DEPLOY_ROLE_ARN = [$ROLE_ARN]"
          if [[ ! "$ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]; then
            echo "::error::AWS_DEPLOY_ROLE_ARN must be a repository variable shaped like arn:aws:iam::123456789012:role/RoleName, with no spaces, quotes or 'GitHubOidcStack.DeployRoleArn =' prefix."
            exit 1
          fi

      # No stored keys: the action asks GitHub for a signed OIDC token and trades
      # it with AWS STS for 1-hour credentials for the role in GitHubOidcStack.
      # That role only trusts this repo's main branch.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-cdk-deploy-${{ github.run_id }}
          aws-region: us-east-1

      # The app has two stacks, so name the one to deploy. GitHubOidcStack is
      # deployed by hand once; CI never touches the role it logs in with.
      # Prints what will change in AWS (handy for learning what CDK generates).
      - name: CDK diff
        run: cdk diff RankerApiStack

      # Builds the Docker image, pushes it to ECR, then creates/updates the
      # CloudFormation stack. --require-approval never skips the interactive
      # "approve IAM changes?" prompt, since there's nobody to answer it in CI.
      - name: CDK deploy
        run: cdk deploy RankerApiStack --require-approval never --outputs-file cdk-outputs.json

      - name: Show API URL
        run: cat cdk-outputs.json
