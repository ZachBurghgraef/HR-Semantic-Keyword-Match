AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2010-05-13

Globals:
  Function:
    Timeout: 60
    MemorySize: 1024
    Runtime: python3.12

Resources:
  SimilarityLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layers/python/
      CompatibleRuntimes:
        - python3.12

  SimilarityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Layers:
        - !Ref SimilarityLayer
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref SimilarityApi
            Path: /{proxy+}
            Method: POST

  SimilarityApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod

Outputs:
  ApiEndpoint:
    Value: !Sub 'https://${SimilarityApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Description: API Gateway endpoint URL
